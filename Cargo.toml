[workspace]
members = ["crates/motion-photo-wasm"]
resolver = "2"

# The WASM artifact is the product. Optimize hard for size and determinism:
# no debug info, no incremental, single codegen unit, LTO across the crate.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
panic = "abort"
